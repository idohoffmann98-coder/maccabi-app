<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta name="robots" content="noindex" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ניהול – צהוב-כחול</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { padding-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 10px 0 4px; }
    input, select, textarea { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="ball">🛠️</span><span>ניהול</span></div><a class="icon-btn" href="/" style="display:grid;place-items:center">🏠</a></header>
  <main>
    <div class="card">
      <label for="token">טוקן ניהול</label>
      <input id="token" type="password" placeholder="ADMIN_TOKEN" />
      <div class="row"><button class="btn primary" id="load">כניסה</button><button class="btn" id="refresh">עדכון נתונים עכשיו</button><button class="btn" id="test">שליחת פוש ניסיון</button></div>
      <p class="muted small" id="msg"></p>
    </div>
    <h2>עדכון פציעה</h2>
    <div class="card">
      <label for="player">שחקן</label><select id="player"></select>
      <label for="injury">סוג הפציעה</label><input id="injury" placeholder="למשל: נקע בקרסול" />
      <label for="ret">זמן חזרה משוער</label><input id="ret" placeholder="למשל: שבועיים / אחרי המחזור ה-20" />
      <label for="note">הערה (לא חובה)</label><input id="note" placeholder="למשל: לפי דיווח באתר המועדון" />
      <div class="row"><button class="btn primary" id="save">שמירה</button></div>
    </div>
    <h2>פציעות פעילות</h2>
    <div class="card" id="list"><div class="empty">היכנסו עם טוקן כדי לראות</div></div>
  </main>
  <script type="module" src="/admin.js"></script>
</body>
</html>
